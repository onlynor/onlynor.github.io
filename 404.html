<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found — OnlyNor</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="globalnav" aria-label="Global">
    <div class="globalnav__inner">
      <a class="globalnav__brand" href="/" aria-label="OnlyNor, home">OnlyNor</a>
      <ul class="globalnav__list">
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/blog/">Blog</a></li>
        <li><a href="https://github.com/onlynor" rel="me noopener noreferrer" target="_blank">GitHub</a></li>
      </ul>
    </div>
  </nav>

  <main id="main">
    <section class="section">
      <div class="wrap wrap--center">
        <p class="eyebrow">404</p>
        <h1 class="section__title">This page can't be found.</h1>
        <p class="section__lede">The link may be outdated, or the page has moved.</p>
        <p class="cta cta--center">
          <a class="button" href="/">Go to the homepage</a>
          <a class="chevron" href="/blog/">Read the blog</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p class="footer__legal">Copyright © <span id="year">2026</span> OnlyNor.</p>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
